[project]
name = "loom-api"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.17.0",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_api"]
