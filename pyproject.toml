[project]
name = "loom"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["loom-api"]

[tool.uv.sources]
loom-api = { workspace = true }

[tool.uv.workspace]
members = ["apps/api"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["apps/api/src", "apps/api/tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]
